# The app namespace. The label turns on image-signature enforcement
# (see policies.yaml). Argo CD must never prune or delete it: that would
# delete the database.
apiVersion: v1
kind: Namespace
metadata:
  name: task-manager
  labels:
    images.task-manager/verify: enforce
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
