apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Namespace label + Kyverno image-signature policies. Synced first, so
  # nothing can start in the namespace before the policies exist.
  source:
    repoURL: https://github.com/Shayur-p60/django-task-manager.git
    targetRevision: feature/gitops
    path: gitops/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: task-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
