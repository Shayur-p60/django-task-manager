apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "task-manager-db.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-manager-db.labels" . | nindent 4 }}
  annotations:
    # Stateful: Argo CD must never delete this, even if it's removed from
    # git (prune) or its Application is deleted. Deleting the database is
    # always a deliberate, manual step.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: {{ .Values.instances }}
  {{- with .Values.imageName }}
  imageName: {{ . }}
  {{- end }}
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: {{ .Values.database }}
      owner: {{ .Values.owner }}
  storage:
    size: {{ .Values.storage.size }}
    {{- with .Values.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
