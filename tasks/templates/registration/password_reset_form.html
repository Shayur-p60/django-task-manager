{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
    <h2>Reset your password</h2>
    <p class="small">Enter your email address and we'll send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset link</button>
    </form>
{% endblock %}
