# CI/CD with security gates and a signed, attested release.
#
# Every pull request, push to main and weekly run executes the tests and the
# security gates. Only a push to main in this repository publishes an image,
# for linux/amd64 and linux/arm64: each platform is built once on a native
# runner, scanned, and pushed; a multi-arch index is made from exactly those
# digests; each platform gets an SBOM attestation; the index and both
# platform images are signed with cosign keyless (GitHub OIDC) and verified.
# See SECURITY.md and the README.
#
# Hardening:
# - Third-party actions are pinned to full commit SHAs (comment = version).
# - Downloaded tools are pinned by version and SHA-256 (install-tool.sh).
# - The workflow token is read-only; jobs ask for more only where needed.
# - No pull_request_target: forked PRs never get secrets or write tokens.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan of main, to catch vulnerabilities published since.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/shayur-p60/task-manager
  # SARIF uploads need security-events: write, which forked PRs don't get.
  CAN_UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # Pinned tool versions and SHA-256 checksums (linux amd64).
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  TRIVY_ARM64_SHA256: e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  SYFT_VERSION: "1.55.0"
  SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
  COSIGN_VERSION: "3.1.4"
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  SEMGREP_VERSION: "1.182.1"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  # ---------------------------------------------------------------- tests --

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      DEBUG: "True"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest -v

      - name: Check production settings
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: tasks.example.com
          DATABASE_URL: postgres://tasks:unused@db.example.com:5432/tasks
          # The deploy check rejects the console email backend, as it should.
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.com
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate a throwaway SECRET_KEY
        run: |
          key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          echo "::add-mask::$key"
          echo "SECRET_KEY=$key" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t task-manager:latest .

      - name: Container refuses to start without a real SECRET_KEY
        # RUN_MIGRATIONS=0 skips migrate, so this proves the entrypoint's
        # own deploy check stops the container. Console email is allowed so
        # the only possible failure is the SECRET_KEY check (tasks.E001).
        run: |
          check_refuses() {
            set +e
            out="$(timeout 60 docker run --rm -e RUN_MIGRATIONS=0 -e ALLOW_CONSOLE_EMAIL=True "$@" task-manager:latest 2>&1)"
            code=$?
            set -e
            echo "$out"
            if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
              echo "::error::Container started (exit $code) with an insecure SECRET_KEY"; exit 1
            fi
            echo "$out" | grep -q "tasks.E001" || { echo "::error::Expected tasks.E001 in output"; exit 1; }
            echo "OK: exited with code $code"
          }
          echo "--- no SECRET_KEY"
          check_refuses
          echo "--- built-in default SECRET_KEY"
          check_refuses -e SECRET_KEY=django-insecure-fallback-key-for-local-dev-only-do-not-use-in-prod

      - name: Start web + postgres and wait until healthy
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl --fail --silent --show-error http://localhost:8000/healthz/

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v

  k8s-lint:
    name: Kubernetes platform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"

      - name: Install kubeconform
        run: >
          .github/scripts/install-tool.sh kubeconform
          "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          "$KUBECONFORM_SHA256" kubeconform

      - name: terraform fmt -check and validate
        run: make tf-check

      - name: helm lint and helm template | kubeconform
        run: make helm-check

  changes:
    name: Detect changes
    # Decides whether this push needs a new image. A commit that only touches
    # gitops/ (a promotion or a rollback) must not publish, or every
    # promotion would trigger another build and promotion.
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Anything outside gitops/ changed?
        id: detect
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: .github/scripts/detect-changes.sh "$BASE" "${HEAD:-$GITHUB_SHA}"

  gitops-check:
    name: GitOps manifests check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Applications must track main
        run: |
          pip install "pyyaml==6.0.3"
          python .github/scripts/check-gitops-target.py gitops/apps

  # ------------------------------------------------------- security gates --

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
          persist-credentials: false

      - name: Install gitleaks
        run: >
          .github/scripts/install-tool.sh gitleaks
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          "$GITLEAKS_SHA256" gitleaks

      - name: Scan full git history (fails on any finding)
        run: >
          gitleaks git . --config .gitleaks.toml --redact --no-banner
          --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sast:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Scan with Python and Django rules
        # All severities go to the Security tab; the next step gates.
        run: >
          semgrep scan --config p/python --config p/django --metrics off
          --sarif --output semgrep.sarif

      - name: Fail on ERROR-severity findings
        # Results suppressed in the source (nosemgrep, with a reason) are
        # still in the SARIF, marked as suppressed; they don't count here.
        run: |
          active='.runs[].results[] | select((.suppressions // []) | length == 0)'
          errors=$(jq "[$active | select(.level == \"error\")] | length" semgrep.sarif)
          others=$(jq "[$active | select(.level != \"error\")] | length" semgrep.sarif)
          suppressed=$(jq '[.runs[].results[] | select((.suppressions // []) | length > 0)] | length' semgrep.sarif)
          echo "Semgrep: $errors error(s), $others lower-severity, $suppressed suppressed in source"
          jq -r "$active"' | "::\(if .level == "error" then "error" else "warning" end) file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId)"' semgrep.sarif
          [ "$errors" -eq 0 ]

      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependencies:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Audit requirements.txt (ships in the image; gates the build)
        id: runtime
        run: |
          set +e
          pip-audit -r requirements.txt --desc on -f json -o pip-audit-runtime.json --progress-spinner off
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          python .github/scripts/pip_audit_to_sarif.py pip-audit-runtime.json requirements.txt error sarif-runtime.sarif

      - name: Audit requirements-dev.txt (development only; warnings)
        run: |
          set +e
          pip-audit -r requirements-dev.txt --desc on -f json -o pip-audit-dev.json --progress-spinner off
          code=$?
          python .github/scripts/pip_audit_to_sarif.py pip-audit-dev.json requirements-dev.txt warning sarif-dev.sarif
          jq -r '.dependencies[] | select(.vulns | length > 0) | "::warning file=requirements-dev.txt::\(.name) \(.version): \([.vulns[].id] | join(", "))"' pip-audit-dev.json
          [ "$code" -eq 0 ] || echo "::warning::Development dependencies have known vulnerabilities (not gating)."

      - name: Upload SARIF (runtime)
        if: always() && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('sarif-runtime.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-runtime.sarif
          category: pip-audit-runtime

      - name: Upload SARIF (dev)
        if: always() && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('sarif-dev.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-dev.sarif
          category: pip-audit-dev

      - name: Fail on vulnerable runtime dependencies
        run: |
          jq -r '.dependencies[] | select(.vulns | length > 0) | "::error file=requirements.txt::\(.name) \(.version): \([.vulns[].id] | join(", "))"' pip-audit-runtime.json
          [ "${{ steps.runtime.outputs.exit }}" = "0" ]

  iac:
    name: Infrastructure config (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: [terraform, kubernetes, dockerfile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: matrix.target == 'kubernetes'
        with:
          version: "v4.3.1"

      - name: Install Trivy
        run: >
          .github/scripts/install-tool.sh trivy
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          "$TRIVY_SHA256" trivy

      - name: Choose scan target
        run: |
          case "${{ matrix.target }}" in
            terraform)  echo "SCAN_PATH=infra/terraform" >> "$GITHUB_ENV" ;;
            dockerfile) echo "SCAN_PATH=Dockerfile" >> "$GITHUB_ENV" ;;
            kubernetes)
              # Scan what Kubernetes actually receives: the rendered charts,
              # in the namespace `make deploy` uses.
              mkdir -p rendered
              helm template task-manager-db deploy/helm/task-manager-db -n task-manager > rendered/task-manager-db.yaml
              helm template task-manager deploy/helm/task-manager -n task-manager --set image.tag=ci > rendered/task-manager.yaml
              echo "SCAN_PATH=rendered" >> "$GITHUB_ENV" ;;
          esac

      - name: Report all findings (SARIF)
        run: >
          trivy config "$SCAN_PATH" --quiet --ignorefile .trivyignore.yaml
          --format sarif --output trivy-config.sarif

      - name: Fail on HIGH/CRITICAL misconfigurations
        run: >
          trivy config "$SCAN_PATH" --quiet --ignorefile .trivyignore.yaml
          --severity HIGH,CRITICAL --exit-code 1

      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config-${{ matrix.target }}

  dockerfile:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hadolint
        run: >
          .github/scripts/install-tool.sh hadolint
          "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          "$HADOLINT_SHA256"

      - name: Lint (SARIF, all levels)
        run: hadolint --config .hadolint.yaml --no-fail --format sarif Dockerfile > hadolint.sarif

      - name: Fail on warnings or errors
        run: hadolint --config .hadolint.yaml Dockerfile

      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('hadolint.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  image-scan-platform:
    name: Image scan (Trivy) (${{ matrix.arch }})
    # On main the publish jobs build, scan and push the images themselves.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04, trivy_asset: Linux-64bit, trivy_sha: TRIVY_SHA256 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm, trivy_asset: Linux-ARM64, trivy_sha: TRIVY_ARM64_SHA256 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          tags: task-manager:scan
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Install Trivy
        run: >
          .github/scripts/install-tool.sh trivy
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${{ matrix.trivy_asset }}.tar.gz"
          "${{ env[matrix.trivy_sha] }}" trivy

      - name: Scan image
        run: .github/scripts/scan-image.sh task-manager:scan

      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.arch }}

  image-scan:
    # One stable check name for branch protection, covering both platforms.
    name: Image scan (Trivy)
    if: always() && github.event_name != 'push'
    needs: image-scan-platform
    runs-on: ubuntu-latest
    steps:
      - name: Both platform scans passed
        run: |
          echo "amd64 + arm64 image scans: ${{ needs.image-scan-platform.result }}"
          [ "${{ needs.image-scan-platform.result }}" = "success" ]

  # --------------------------------------------------------------- release --
  #
  # Two stages, so each platform is built natively (no emulation) and the
  # multi-arch image is assembled only from digests that were scanned:
  #
  #   publish-platform (amd64, arm64)  build once -> scan -> push :<sha>-<arch>
  #                                    -> record the pushed digest
  #   publish                          index :<sha> from those two digests
  #                                    -> SBOM + attestation per platform
  #                                    -> sign index + platforms -> verify

  publish-platform:
    name: Publish ${{ matrix.arch }} (build, scan, push)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Shayur-p60/django-task-manager' &&
      needs.changes.outputs.app == 'true'
    needs: [changes, test, docker-smoke, k8s-lint, gitops-check, secrets, sast, dependencies, iac, dockerfile]
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: publish-main-${{ matrix.arch }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write        # push to GHCR with GITHUB_TOKEN
      security-events: write # SARIF for the released image
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04, trivy_asset: Linux-64bit, trivy_sha: TRIVY_SHA256 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm, trivy_asset: Linux-ARM64, trivy_sha: TRIVY_ARM64_SHA256 }
    env:
      PLATFORM_TAG: ${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: >
          .github/scripts/install-tool.sh trivy
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${{ matrix.trivy_asset }}.tar.gz"
          "${{ env[matrix.trivy_sha] }}" trivy

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built exactly once per platform. The same local image is scanned and
      # then pushed; the publish job only ever uses the digest the push returned.
      - name: Build image (once)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.PLATFORM_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=task-manager
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Record image ID and check platform
        run: |
          id="$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME:$PLATFORM_TAG")"
          arch="$(docker image inspect --format '{{.Architecture}}' "$IMAGE_NAME:$PLATFORM_TAG")"
          [ "$arch" = "${{ matrix.arch }}" ] || { echo "::error::Built $arch, expected ${{ matrix.arch }}"; exit 1; }
          echo "IMAGE_ID=$id" >> "$GITHUB_ENV"

      - name: Scan image (gate)
        run: .github/scripts/scan-image.sh "$IMAGE_NAME:$PLATFORM_TAG"

      - name: Upload SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.arch }}

      - name: Push the scanned image
        run: |
          # Refuse to push anything other than the image that was scanned.
          [ "$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME:$PLATFORM_TAG")" = "$IMAGE_ID" ]
          docker push "$IMAGE_NAME:$PLATFORM_TAG"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$PLATFORM_TAG")"
          digest="${digest#*@}"
          case "$digest" in sha256:*) ;; *) echo "::error::No digest after push"; exit 1 ;; esac
          mkdir -p digests
          echo "$digest" > "digests/${{ matrix.arch }}"
          echo "Pushed $IMAGE_NAME:$PLATFORM_TAG as $digest"

      - name: Hand the digest to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish multi-arch (index, SBOM, sign, verify)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Shayur-p60/django-task-manager'
    needs: publish-platform
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write        # push the index and attestations to GHCR
      id-token: write        # OIDC token for cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Syft and cosign
        run: |
          .github/scripts/install-tool.sh syft \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            "$SYFT_SHA256" syft
          .github/scripts/install-tool.sh cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            "$COSIGN_SHA256"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect the scanned platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Create the multi-arch index from those digests
        run: |
          amd64="$(cat digests/amd64)"
          arm64="$(cat digests/arm64)"
          docker buildx imagetools create --tag "$IMAGE_NAME:$GITHUB_SHA" \
            "$IMAGE_NAME@$amd64" "$IMAGE_NAME@$arm64"
          index="$(docker buildx imagetools inspect "$IMAGE_NAME:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          # The index must reference exactly the two scanned digests, nothing else.
          listed="$(docker buildx imagetools inspect "$IMAGE_NAME@$index" --raw | jq -r '[.manifests[].digest] | sort | join(" ")')"
          expected="$(printf '%s\n' "$amd64" "$arm64" | sort | paste -sd' ' -)"
          [ "$listed" = "$expected" ] || { echo "::error::Index lists [$listed], expected [$expected]"; exit 1; }
          {
            echo "INDEX_DIGEST=$index"
            echo "INDEX_REF=$IMAGE_NAME@$index"
            echo "AMD64_REF=$IMAGE_NAME@$amd64"
            echo "ARM64_REF=$IMAGE_NAME@$arm64"
          } >> "$GITHUB_ENV"
          echo "Index $index -> amd64 $amd64, arm64 $arm64"

      - name: Generate SBOMs and attach them as signed attestations
        run: |
          for arch in amd64 arm64; do
            ref_var="${arch^^}_REF"; ref="${!ref_var}"
            syft scan "registry:$ref" -o "spdx-json=sbom-$arch.spdx.json"
            cosign attest --yes --type spdxjson --predicate "sbom-$arch.spdx.json" "$ref"
          done

      - name: Sign the index and both platform images (cosign keyless)
        # --recursive also signs every platform manifest the index lists, so
        # a platform-specific pull verifies too.
        run: cosign sign --yes --recursive "$INDEX_REF"

      - name: Verify signatures and SBOM attestations
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          for ref in "$INDEX_REF" "$AMD64_REF" "$ARM64_REF"; do
            cosign verify "$ref" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
            echo "Signature verified: $ref"
          done
          for ref in "$AMD64_REF" "$ARM64_REF"; do
            cosign verify-attestation "$ref" --type spdxjson \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
            echo "SBOM attestation verified: $ref"
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom-*.spdx.json

      - name: Summary
        run: |
          {
            echo "### Published multi-arch image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$IMAGE_NAME:$GITHUB_SHA\` |"
            echo "| Index digest | \`$INDEX_DIGEST\` |"
            echo "| linux/amd64 | \`${AMD64_REF#*@}\` |"
            echo "| linux/arm64 | \`${ARM64_REF#*@}\` |"
            echo "| Signed | index + both platforms (cosign keyless, GitHub OIDC) |"
            echo "| SBOM | SPDX JSON per platform, attached as signed attestations |"
            echo
            echo "Verify:"
            echo '```bash'
            echo "cosign verify $INDEX_REF \\"
            echo "  --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
